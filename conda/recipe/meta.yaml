{% set version = "1.0.0" %}

package:
  name: updated-mlst
  version: {{ version }}

source:
  path: ../../updated_mlst

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - updated-mlst = updated_mlst.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - numpy
    - pandas
    - numba
    - biopython
    - click
    - blast >=2.14
    - diamond >=2.2

test:
  imports:
    - updated_mlst
  commands:
    - updated-mlst --version
    - updated-mlst --help

about:
  home: https://github.com/Guilai-Jiang/updated-MLST
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file:
    - LICENSE
    - COPYING
  summary: Updated core-genome MLST and HierCC assignment for bacteria
  dev_url: https://github.com/Guilai-Jiang/updated-MLST

extra:
  recipe-maintainers:
    - Guilai-Jiang
