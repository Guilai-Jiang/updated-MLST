[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "updated-mlst"
dynamic = ["version"]
description = "Updated core-genome MLST and HierCC assignment for bacteria"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYING"]
authors = [
    { name = "Guilai Jiang", email = "gljiang@alu.suda.edu.cn" },
]
dependencies = ["numpy", "pandas", "numba", "biopython", "click"]

[project.scripts]
updated-mlst = "updated_mlst.cli:main"

[tool.setuptools.dynamic]
version = { attr = "updated_mlst.__version__" }

[tool.setuptools.packages.find]
include = ["updated_mlst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
